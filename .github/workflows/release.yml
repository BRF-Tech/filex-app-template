name: Release

# A tag `vX.Y.Z` publishes that version. Before tagging, on your machine:
#
#   1. bump "version" in filex-app.json
#   2. bash scripts/build.sh --stamp      (writes the module's sha256 into filex-app.json)
#   3. commit, tag vX.Y.Z, push the tag
#
# Here the module is built again from the tag and must hash to what
# filex-app.json says — filex refuses a module whose sha256 differs. Then
# plugin.wasm is attached to the GitHub release, which is where the
# manifest's wasm.url points: an administrator installs the app with
# "owner/name" and the tag (Admin → Plugins → Apps → Install an app → GitHub).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Use the toolchain go.mod pins
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"

      - name: The tag is the manifest's version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version filex-app.json)"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME, but filex-app.json says version $have" >&2
            exit 1
          fi

      - name: The module address is this repository's release
        run: |
          want="https://github.com/${GITHUB_REPOSITORY}/releases/download/{tag}/plugin.wasm"
          have="$(jq -r .wasm.url filex-app.json)"
          if [ "${want,,}" != "${have,,}" ]; then
            echo "wasm.url is $have; filex would download from there, not from this release ($want)" >&2
            exit 1
          fi

      - name: Tests, then plugin.wasm
        run: bash scripts/build.sh

      - name: The committed sha256 is this build's
        run: |
          built="$(cut -d' ' -f1 plugin.wasm.sha256)"
          committed="$(jq -r .wasm.sha256 filex-app.json)"
          echo "built:     $built"
          echo "committed: $committed"
          if [ "$built" != "$committed" ]; then
            echo "filex-app.json does not carry this build's hash: run 'bash scripts/build.sh --stamp', commit, tag again" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            plugin.wasm
            plugin.wasm.sha256
            filex-app.json
